<!DOCTYPE html>
<html>
<head>
    <title>Student Voting System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="login-page">

<div class="container-fluid">
    <div class="row vh-100">

        <!-- LEFT SIDE -->
        <div class="col-md-6 left-panel d-flex flex-column justify-content-center px-5">

            <h1 class="title">STUDENT VOTING SYSTEM</h1>

            <p class="subtitle">
                Secure voting platform for student elections.
            </p>

            <ul class="features">
                <li>✔ One student one vote</li>
                <li>✔ Real-time results</li>
                <li>✔ Transparent elections</li>
            </ul>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-6 right-panel d-flex align-items-center justify-content-center">

            <div class="login-box">

                <h3 class="mb-4">Login</h3>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                <form method="post" action="">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Admission Number</label>
                        <input
                            type="text"
                            name="admission_no"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >
                    </div>

                    <button class="btn btn-primary w-100">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

</body>
</html>
